<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хаб Новин</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121214">
    <style>
        :root {
            --bg: #121214; --card: #1c1c21; --card-border: #27272a;
            --text: #e4e4e7; --muted: #a1a1aa; --accent: #3b82f6;
            --urgent: #ef4444; --energy: #eab308; --world: #22c55e;
            --ua: #3b82f6; --kremen: #f97316; --digest-bg: #1e293b;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header-btns { display: flex; gap: 6px; }
        .search-box { width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 10px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; outline: none; }
        .status-badge { display: none; background: #3b82f620; border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; text-align: center; }
        .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; background: #18181b; padding: 4px; border-radius: 12px; border: 1px solid var(--card-border); }
        .filter-tab { flex: 1; background: none; border: none; color: var(--muted); padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
        .filter-tab.active { background: var(--card); color: #fff; }
        .quick-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
        .quick-btn { background: #18181b; border: 1px solid var(--card-border); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .quick-btn.active#q-alert { background: #ef444425; border-color: var(--urgent); color: var(--urgent); }
        .quick-btn.active#q-power { background: #eab30825; border-color: var(--energy); color: var(--energy); }
        .quick-btn.active#q-world { background: #22c55e25; border-color: var(--world); color: var(--world); }
        .quick-btn.active#q-ua { background: #3b82f625; border-color: var(--ua); color: var(--ua); }
        .quick-btn.active#q-kremen { background: #f9731625; border-color: var(--kremen); color: var(--kremen); }
        .digest-card { background: var(--digest-bg); border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
        .digest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .digest-title { font-size: 15px; font-weight: 600; margin: 0; }
        .audio-btn { background: #334155; border: none; color: #38bdf8; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 500; }
        .digest-card ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: #cbd5e1; line-height: 1.45; }
        .tag-cloud { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; }
        .tag-btn { background: var(--card); color: var(--text); border: 1px solid var(--card-border); border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .feed { display: flex; flex-direction: column; gap: 16px; }
        .card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--card-border); transition: border-color 0.2s, box-shadow 0.2s; }
        .card.urgent { border: 1px solid var(--urgent); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .card.theme-energy { border: 1px solid var(--energy); box-shadow: 0 0 10px rgba(234, 179, 8, 0.25); }
        .card.theme-world { border: 1px solid var(--world); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        .card.theme-ua { border: 1px solid var(--ua); box-shadow: 0 0 10px rgba(59, 130, 246, 0.25); }
        .card.theme-kremen { border: 1px solid var(--kremen); box-shadow: 0 0 10px rgba(249, 115, 22, 0.25); }
        .media-gallery { display: grid; gap: 4px; background: #09090b; }
        .gallery-1 { grid-template-columns: 1fr; }
        .gallery-2 { grid-template-columns: 1fr 1fr; }
        .gallery-3 { grid-template-columns: 1fr 1fr; }
        .gallery-3 img:first-child { grid-column: span 2; }
        .gallery-4 { grid-template-columns: 1fr 1fr; }
        .card-media-wrap { width: 100%; max-height: 240px; overflow: hidden; background: #121214; border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .card-img { width: 100%; height: auto; object-fit: cover; display: block; max-height: 240px; }
        .related-chain-wrap { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--card-border); }
        .related-chain-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
        .related-chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .source-chip-btn { background: #27272a; border: 1px solid var(--card-border); color: var(--text); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .source-chip-btn.active, .source-chip-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .source-expand-box { margin-top: 8px; padding: 10px; background: #18181b; border: 1px solid var(--card-border); border-radius: 10px; font-size: 13px; }
        .source-box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid var(--card-border); padding-bottom: 6px; }
        .source-box-title { font-weight: 600; color: #fff; }
        .source-box-time { font-size: 11px; color: var(--muted); margin-left: 8px; }
        .source-direct-link { color: var(--accent); text-decoration: none; font-size: 12px; }
        .source-direct-link:hover { text-decoration: underline; }
        .source-box-body { color: #d4d4d8; line-height: 1.4; }

</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="margin:0;display:flex;align-items:center;gap:8px;">⚡ Новини</h2>
            <div class="header-btns">
                <button class="tag-btn" onclick="location.reload()">🔄 Оновити</button>
                <button class="tag-btn" onclick="openSourcesModal()">⚙️ Джерела</button>
                <button class="tag-btn" onclick="toggleBookmarkedOnly()" id="fav-filter">⭐ Збережені</button>
            </div>
        </div>
        <div class="status-badge" id="status-bar">⏳ Збираємо та сортуємо новини...</div>
        <div class="filter-bar">
            <button class="filter-tab active" id="tab-today" onclick="setDateFilter('today')">Сьогодні</button>
            <button class="filter-tab" id="tab-yesterday" onclick="setDateFilter('yesterday')">Вчора</button>
            <button class="filter-tab" id="tab-week" onclick="setDateFilter('week')">За 7 днів</button>
        </div>
        <div class="quick-filters">
            <button class="quick-btn" id="q-alert" onclick="toggleQuickFilter('alert')">🚨 Термінові</button>
            <button class="quick-btn" id="q-power" onclick="toggleQuickFilter('power')">⚡ Енергетика</button>
            <button class="quick-btn" id="q-kremen" onclick="toggleQuickFilter('kremen')">⚠️Kremen🔞</button>
            <button class="quick-btn" id="q-ua" onclick="toggleQuickFilter('ua')">UA🇺🇦</button>
            <button class="quick-btn" id="q-world" onclick="toggleQuickFilter('world')">🌍 World🌎</button>
        </div>
        <input type="text" id="search-input" class="search-box" placeholder="Швидкий пошук у подіях..." oninput="handleSearch()">
        <div class="digest-card" id="digest-box" style="display:none;">
            <div class="digest-header">
                <span class="digest-title">📌 Головне коротко</span>
                <button class="audio-btn" id="tts-btn" onclick="toggleTTS()">🔊 Слухати</button>
            </div>
            <ul id="digest-list"></ul>
        </div>
        <div class="tag-cloud" id="tag-bar"><button class="tag-btn active" onclick="filterByTag('all')">Всі</button></div>
        <div class="feed" id="feed-container"></div>
    </div>

    <script>

        let currentArticles = [];
        let activeDateFilter = 'today';
        let activeQuickFilters = new Set();
        let activeTag = 'all';
        let bookmarkedOnly = false;

        function formatDateTime(iso) {
            try {
                var d = new Date(iso);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch(e) { return ''; }
        }

        function getArticleMediaHtml(a) {
            var url = a.image_url || a.img || a.photo || a.media || a.thumbnail || '';
            if (!url && a.related_sources) {
                for (var i = 0; i < a.related_sources.length; i++) {
                    var s = a.related_sources[i];
                    url = s.image_url || s.img || s.photo || '';
                    if (url) break;
                }
            }
            if (!url) return '';
            return '<div class="card-media-wrap"><img src="' + url + '" alt="" loading="lazy" class="card-img"></div>';
        }

        function getRelatedHtml(a) {
            if (!a.related_sources || !a.related_sources.length) return '';
            var list = [];
            if (a.source_name) {
                list.push({
                    name: a.source_name,
                    url: a.source_url || '#',
                    text: a.raw_text || a.summary || '',
                    time: a.published_at || '',
                    isBase: true
                });
            }
            a.related_sources.forEach(function(s, idx) {
                list.push({
                    name: s.source_name || ('Джерело ' + (idx + 1)),
                    url: s.source_url || '#',
                    text: s.raw_text || 'Текст цього джерела не збережено.',
                    time: s.published_at || '',
                    isBase: false
                });
            });

            var chips = list.map(function(s, idx) {
                var badge = s.isBase ? '⭐ ' : '&#128279; ';
                var cls = s.isBase ? 'source-chip-btn is-main' : 'source-chip-btn';
                return '<button type="button" class="' + cls + '" onclick="toggleSourceAccordion(\'' + a.id + '\', ' + idx + ', event)">' + badge + s.name + '</button>';
            }).join(' ');

            var panels = list.map(function(s, idx) {
                var link = (s.url && s.url !== '#') ? '<a href="' + s.url + '" target="_blank" rel="noopener noreferrer" class="source-direct-link">&#128279; Читати в першоджерелі &#8599;</a>' : '';
                var time = s.time ? '<span class="source-box-time">&#128336; ' + s.time + '</span>' : '';
                var star = s.isBase ? '⭐ ' : '';
                return '<div id="src-box-' + a.id + '-' + idx + '" class="source-expand-box" style="display:none;">' +
                       '<div class="source-box-header"><div style="display:flex;align-items:center;"><span class="source-box-title">' + star + s.name + '</span>' + time + '</div>' + link + '</div>' +
                       '<div class="source-box-body">' + s.text + '</div>' +
                       '</div>';
            }).join('');

            return '<div class="related-chain-wrap"><div class="related-chain-label">Пов&#8217язані джерела:</div><div class="related-chips-row">' + chips + '</div>' + panels + '</div>';
        }

        window.toggleSourceAccordion = function(articleId, idx, event) {
            if (event) event.stopPropagation();
            var targetId = 'src-box-' + articleId + '-' + idx;
            var targetBox = document.getElementById(targetId);
            if (!targetBox) return;

            var isVisible = (targetBox.style.display === 'block');
            var card = targetBox.closest('.related-chain-wrap') || document;

            card.querySelectorAll('.source-expand-box').forEach(function(box) { box.style.display = 'none'; });
            card.querySelectorAll('.source-chip-btn').forEach(function(btn) { btn.classList.remove('active'); });

            if (!isVisible) {
                targetBox.style.display = 'block';
                if (event && event.currentTarget) event.currentTarget.classList.add('active');
            }
        };

        function renderArticles() {
            var container = document.getElementById('feed-container');
            if (!container) return;
            container.innerHTML = '';
            
            var items = currentArticles || [];
            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">Немає новин для відображення</div>';
                return;
            }

            items.forEach(function(a) {
                var mediaHtml = getArticleMediaHtml(a);
                var relHtml = getRelatedHtml(a);
                var isUrgent = a.is_urgent || false;
                var theme = 'theme-' + (a.category || 'default');

                var singleActionsHtml = '';
                if (!relHtml) {
                    singleActionsHtml = '<div class="card-actions"><a href="' + (a.source_url || '#') + '" target="_blank" rel="noopener noreferrer" class="source-link">Джерело &#8599;</a></div>';
                }

                var card = document.createElement('div');
                card.className = 'card ' + theme;
                card.innerHTML = mediaHtml +
                    '<div class="card-body">' +
                        '<div class="card-meta"><span>' + (a.source_name || 'Канал') + ' &bull; ' + (a.category || 'Новина') + '</span></div>' +
                        '<div class="card-time-row">' + (isUrgent ? '<span class="urgent-badge">&#128680; ТЕРМІНОВО</span>' : '') + (a.published_at ? '<span>&#128336; ' + formatDateTime(a.published_at) + '</span>' : '') + '</div>' +
                        '<div class="card-title">' + (a.title || '') + '</div>' +
                        '<div class="card-summary">' + (a.summary || a.raw_text || '') + '</div>' +
                        relHtml +
                        singleActionsHtml +
                    '</div>';
                container.appendChild(card);
            });
        }

        async function loadFeed() {
            try {
                let res = await fetch('news.json?' + Date.now());
                if (res.ok) {
                    currentArticles = await res.json();
                    renderArticles();
                } else {
                    console.error("Не вдалося завантажити news.json, статус:", res.status);
                }
            } catch(e) {
                console.error("Помилка мережі при завантаженні новин:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadFeed);

</script>

        }

        window.toggleSourceAccordion = function(articleId, idx, event) {
            if (event) event.stopPropagation();
            var targetId = 'src-box-' + articleId + '-' + idx;
            var targetBox = document.getElementById(targetId);
            if (!targetBox) return;

            var isVisible = (targetBox.style.display === 'block');
            var card = targetBox.closest('.related-chain-wrap') || document;

            card.querySelectorAll('.source-expand-box').forEach(function(box) { box.style.display = 'none'; });
            card.querySelectorAll('.source-chip-btn').forEach(function(btn) { btn.classList.remove('active'); });

            if (!isVisible) {
                targetBox.style.display = 'block';
                if (event && event.currentTarget) event.currentTarget.classList.add('active');
            }
        };

        function renderArticles() {
            var container = document.getElementById('feed-container');
            if (!container) return;
            container.innerHTML = '';
            
            var items = currentArticles || [];
            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);">Немає новин для відображення</div>';
                return;
            }

            items.forEach(function(a) {
                var mediaHtml = getArticleMediaHtml(a);
                var relHtml = getRelatedHtml(a);
                var isUrgent = a.is_urgent || false;
                var theme = 'theme-' + (a.category || 'default');

                var singleActionsHtml = '';
                if (!relHtml) {
                    singleActionsHtml = '<div class="card-actions"><a href="' + (a.source_url || '#') + '" target="_blank" rel="noopener noreferrer" class="source-link">Джерело &#8599;</a></div>';
                }

                var card = document.createElement('div');
                card.className = 'card ' + theme;
                card.innerHTML = mediaHtml +
                    '<div class="card-body">' +
                        '<div class="card-meta"><span>' + (a.source_name || 'Канал') + ' &bull; ' + (a.category || 'Новина') + '</span></div>' +
                        '<div class="card-time-row">' + (isUrgent ? '<span class="urgent-badge">&#128680; ТЕРМІНОВО</span>' : '') + (a.published_at ? '<span>&#128336; ' + formatDateTime(a.published_at) + '</span>' : '') + '</div>' +
                        '<div class="card-title">' + (a.title || '') + '</div>' +
                        '<div class="card-summary">' + (a.summary || a.raw_text || '') + '</div>' +
                        relHtml +
                        singleActionsHtml +
                    '</div>';
                container.appendChild(card);
            });
        }

        async function loadFeed() {
            try {
                let res = await fetch('news.json?' + Date.now());
                if (res.ok) {
                    currentArticles = await res.json();
                    renderArticles();
                } else {
                    console.error("Не вдалося завантажити news.json, статус:", res.status);
                }
            } catch(e) {
                console.error("Помилка мережі при завантаженні новин:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', loadFeed);

</script>

</body>
</html>
