<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хаб Новин</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">
  <style>
    :root {
      --bg: #121214; --card: #1c1c21; --card-border: #27272a;
      --text: #e4e4e7; --muted: #a1a1aa; --accent: #3b82f6;
      --urgent: #ef4444; --energy: #eab308; --world: #22c55e;
      --ua: #3b82f6; --kremen: #f97316; --digest-bg: #1e293b;
    }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header-btns { display: flex; gap: 6px; }
    .search-box { width: 100%; box-sizing: border-box; background: var(--card); border: 1px solid var(--card-border); color: var(--text); padding: 10px 14px; border-radius: 12px; font-size: 14px; margin-bottom: 12px; outline: none; }
    .status-badge { display: none; background: #3b82f620; border: 1px solid var(--accent); color: var(--accent); padding: 8px 12px; border-radius: 10px; font-size: 13px; margin-bottom: 12px; text-align: center; }
    .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; background: #18181b; padding: 4px; border-radius: 12px; border: 1px solid var(--card-border); }
    .filter-tab { flex: 1; background: none; border: none; color: var(--muted); padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
    .filter-tab.active { background: var(--card); color: #fff; }
    .quick-filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .quick-btn { background: #18181b; border: 1px solid var(--card-border); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .quick-btn.active#q-alert { background: #ef444425; border-color: var(--urgent); color: var(--urgent); }
    .quick-btn.active#q-power { background: #eab30825; border-color: var(--energy); color: var(--energy); }
    .quick-btn.active#q-world { background: #22c55e25; border-color: var(--world); color: var(--world); }
    .quick-btn.active#q-ua { background: #3b82f625; border-color: var(--ua); color: var(--ua); }
    .quick-btn.active#q-kremen { background: #f9731625; border-color: var(--kremen); color: var(--kremen); }
    .digest-card { background: var(--digest-bg); border: 1px solid #334155; border-radius: 14px; padding: 14px; margin-bottom: 16px; }
    .digest-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .digest-title { font-size: 15px; font-weight: 600; margin: 0; }
    .audio-btn { background: #334155; border: none; color: #38bdf8; border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-weight: 500; }
    .digest-card ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: #cbd5e1; line-height: 1.45; }
    .tag-cloud { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; }
    .tag-btn { background: var(--card); color: var(--text); border: 1px solid var(--card-border); border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .tag-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .feed { display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card); border-radius: 14px; overflow: hidden; border: 1px solid var(--card-border); transition: border-color 0.2s, box-shadow 0.2s; }
    .card.urgent { border: 1px solid var(--urgent); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
    .card.theme-energy { border: 1px solid var(--energy); box-shadow: 0 0 10px rgba(234, 179, 8, 0.25); }
    .card.theme-world { border: 1px solid var(--world); box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
    .card.theme-ua { border: 1px solid var(--ua); box-shadow: 0 0 10px rgba(59, 130, 246, 0.25); }
    .card.theme-kremen { border: 1px solid var(--kremen); box-shadow: 0 0 10px rgba(249, 115, 22, 0.25); }
    .media-gallery { display: grid; gap: 4px; background: #09090b; }
    .gallery-1 { grid-template-columns: 1fr; }
    .gallery-2 { grid-template-columns: 1fr 1fr; }
    .gallery-3 { grid-template-columns: 1fr 1fr; }
    .gallery-3 img:first-child { grid-column: span 2; }
    .gallery-4 { grid-template-columns: 1fr 1fr; }
    .media-gallery img { width: 100%; height: 220px; object-fit: cover; cursor: pointer; display: block; }
    .gallery-1 img { height: auto; max-height: 380px; }
    .media-gallery video { width: 100%; max-height: 300px; display: block; }
    .card-body { padding: 14px; }
    .card-meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; }
    .card-time-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
    .reading-time { font-size: 11px; color: #71717a; }
    .urgent-badge { background: var(--urgent); color: #fff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
    .card-title { font-size: 16.5px; font-weight: 600; margin: 0 0 8px; line-height: 1.35; }
    .card-summary { font-size: 14px; color: #d4d4d8; line-height: 1.45; margin: 0 0 10px; }
    .full-text { display: none; margin-top: 10px; padding: 10px 12px; background: #18181b; border-radius: 10px; border: 1px solid var(--card-border); font-size: 13.5px; line-height: 1.5; color: #e4e4e7; white-space: pre-wrap; }
    .related-box { margin-top: 10px; padding: 8px 10px; background: #18181b; border-radius: 8px; font-size: 12px; color: var(--muted); }
    .related-box a { color: var(--accent); text-decoration: none; margin-left: 4px; }
    .card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--card-border); }
    .toggle-full-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; padding: 0; font-weight: 500; }
    .source-link { font-size: 12px; color: var(--muted); text-decoration: none; }
    .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .badge { font-size: 11px; background: #27272a; color: var(--muted); padding: 2px 8px; border-radius: 6px; }
    .bookmark-btn { background: none; border: none; font-size: 18px; cursor: pointer; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; padding: 16px; z-index: 100; }
    .modal-content { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 18px; max-width: 480px; width: 100%; box-sizing: border-box; }
    .sources-list { margin: 14px 0; display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; }
    .source-item { display: flex; justify-content: space-between; align-items: center; background: #18181b; padding: 8px 12px; border-radius: 8px; font-size: 13px; }
    .del-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 18px; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); z-index: 200; justify-content: center; align-items: center; padding: 12px; }
    .lightbox img { max-width: 100%; max-height: 95vh; border-radius: 8px; object-fit: contain; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 32px; color: #fff; cursor: pointer; background: none; border: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 style="margin:0;">⚡ Новини</h2>
      <div class="header-btns">
        <button class="tag-btn" onclick="triggerRefresh()">🔄 Оновити</button>
        <button class="tag-btn" onclick="openSourcesModal()">⚙️ Джерела</button>
        <button class="tag-btn" onclick="toggleBookmarkedOnly()" id="fav-filter">⭐ Збережені</button>
      </div>
    </div>
    <div class="status-badge" id="status-bar">⏳ Збираємо та сортуємо новини...</div>
    <div class="filter-bar">
      <button class="filter-tab active" id="tab-today" onclick="setDateFilter('today')">Сьогодні</button>
      <button class="filter-tab" id="tab-yesterday" onclick="setDateFilter('yesterday')">Вчора</button>
      <button class="filter-tab" id="tab-week" onclick="setDateFilter('week')">За 7 днів</button>
    </div>
    <div class="quick-filters">
      <button class="quick-btn" id="q-alert" onclick="toggleQuickFilter('alert')">🚨 Термінові</button>
      <button class="quick-btn" id="q-power" onclick="toggleQuickFilter('power')">⚡ Енергетика</button>
      <button class="quick-btn" id="q-kremen" onclick="toggleQuickFilter('kremen')">⚠️Kremen🔞</button>
      <button class="quick-btn" id="q-ua" onclick="toggleQuickFilter('ua')">UA🇺🇦</button>
      <button class="quick-btn" id="q-world" onclick="toggleQuickFilter('world')">🌍 World🌎</button>
    </div>
    <input type="text" id="search-input" class="search-box" placeholder="Швидкий пошук у подіях..." oninput="handleSearch()">
    <div class="digest-card" id="digest-box" style="display:none;">
      <div class="digest-header">
        <span class="digest-title">📌 Головне коротко</span>
        <button class="audio-btn" id="tts-btn" onclick="toggleTTS()">🔊 Слухати</button>
      </div>
      <ul id="digest-list"></ul>
    </div>
    <div class="tag-cloud" id="tag-bar"><button class="tag-btn active" onclick="filterByTag('all')">Всі</button></div>
    <div class="feed" id="feed-container"></div>
  </div>
  <div class="lightbox" id="lightbox-modal" onclick="closeLightbox()"><button class="lightbox-close" onclick="closeLightbox()">&times;</button><img id="lightbox-img" src="" alt="Full view" onclick="event.stopPropagation()"></div>
  <div class="modal" id="sources-modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Керування джерелами</h3>
      <div class="sources-list" id="modal-sources-list"></div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <input type="text" id="new-channel-input" class="search-box" style="margin:0;" placeholder="Вставте посилання">
        <button class="tag-btn active" onclick="addNewSource()">Додати</button>
      </div>
      <div style="text-align:right;margin-top:16px;"><button class="tag-btn" onclick="closeSourcesModal()">Закрити</button></div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    let rawData = { digest: [], articles: [] };
    let currentSources = [];
    let activeTag = 'all';
    let dateFilter = 'week';
    let quickFilter = null;
    let searchQuery = '';
    let showOnlyFav = false;
    let pollInterval = null;
    let isSpeaking = false;
    function parseItemDate(s) { return s ? new Date(s) : new Date(); }
    function formatDateTime(s) {
      if (!s) return '';
      const d = parseItemDate(s);
      return isNaN(d.getTime()) ? '' : d.toLocaleString('uk-UA', { timeZone: 'Europe/Kyiv', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function calcReadingTime(t) {
      const w = (t || '').trim().split(/\s+/).length;
      const sec = Math.max(15, Math.round((w / 160) * 60));
      return sec < 60 ? ('⏱ ' + sec + ' сек') : ('⏱ ' + Math.round(sec / 60) + ' хв');
    }
    function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    function isEnergyArticle(a) {
      const t = ((a.title||'') + ' ' + (a.summary||'') + ' ' + (a.tags||[]).join(' ')).toLowerCase();
      return ['світл', 'енерг', 'відключ', 'графік', 'блекаут', 'обленерго', 'знеструм', 'дтек'].some(k => t.includes(k));
    }
    function isKremenArticle(a) {
      const s = (a.source_name||'').toLowerCase(); const u = (a.source_url||'').toLowerCase(); const t = ((a.title||'') + ' ' + (a.summary||'')).toLowerCase();
      return s.includes('kremen') || u.includes('kremen') || t.includes('кременчу');
    }
    function isWorldArticle(a) {
      const s = (a.source_name||'').toLowerCase(); const u = (a.source_url||'').toLowerCase(); const c = (a.category||'').toLowerCase();
      return ['bbc', 'reuters', 'economist', 'aljazeera', 'dw', 'bloomberg', 'apnews'].some(k => s.includes(k) || u.includes(k)) || c === 'світ';
    }
    function isUaArticle(a) {
      const s = (a.source_name||'').toLowerCase(); const u = (a.source_url||'').toLowerCase();
      return ['suspilne', 'hromadske', 'eurointegration', 'resurgam', 'holosameryky'].some(k => s.includes(k) || u.includes(k));
    }
    async function init() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();
        rawData = Array.isArray(data) ? { digest: [], articles: data } : data;
        setDateFilter('week'); renderDigest(); renderTags(); renderFeed();
      } catch (e) {
        document.getElementById('feed-container').innerHTML = '<p style="text-align:center;color:gray;">Немає новин. Натисніть "Оновити".</p>';
      }
    }
    function renderDigest() {
      const box = document.getElementById('digest-box'); const list = document.getElementById('digest-list');
      if (rawData.digest && rawData.digest.length > 0) {
        box.style.display = 'block'; list.innerHTML = rawData.digest.map(i => '<li>' + i + '</li>').join('');
      } else { box.style.display = 'none'; }
    }
    function toggleTTS() {
      if (!('speechSynthesis' in window)) { alert('Аудіо не підтримується.'); return; }
      const btn = document.getElementById('tts-btn');
      if (isSpeaking) { window.speechSynthesis.cancel(); isSpeaking = false; btn.innerText = '🔊 Слухати'; return; }
      if (!rawData.digest || !rawData.digest.length) return;
      const u = new SpeechSynthesisUtterance('Головне коротко: ' + rawData.digest.join('. '));
      u.lang = 'uk-UA'; u.rate = 1.05;
      u.onend = () => { isSpeaking = false; btn.innerText = '🔊 Слухати'; };
      u.onerror = () => { isSpeaking = false; btn.innerText = '🔊 Слухати'; };
      window.speechSynthesis.speak(u); isSpeaking = true; btn.innerText = '⏹ Зупинити';
    }
    function renderTags() {
      const tags = new Set(); (rawData.articles || []).forEach(a => (a.tags || []).forEach(t => tags.add(t)));
      const bar = document.getElementById('tag-bar');
      bar.innerHTML = '<button class="tag-btn active" onclick="filterByTag(\'all\')">Всі</button>';
      tags.forEach(t => bar.innerHTML += '<button class="tag-btn" onclick="filterByTag(\'' + t + '\')">#' + t + '</button>');
    }
    function setDateFilter(f) {
      dateFilter = f; document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.remove('active'));
      const cur = document.getElementById('tab-' + f); if (cur) cur.classList.add('active'); renderFeed();
    }
    function toggleQuickFilter(type) {
      quickFilter = (quickFilter === type) ? null : type;
      ['alert', 'power', 'world', 'ua', 'kremen'].forEach(k => {
        const b = document.getElementById('q-' + k); if (b) b.classList.toggle('active', quickFilter === k);
      });
      renderFeed();
    }
    function getBookmarks() { return JSON.parse(localStorage.getItem('fav_news') || '[]'); }
    function toggleBookmark(id) {
      let favs = getBookmarks();
      favs = favs.includes(id) ? favs.filter(i => i !== id) : [...favs, id];
      localStorage.setItem('fav_news', JSON.stringify(favs)); renderFeed();
    }
    function toggleBookmarkedOnly() { showOnlyFav = !showOnlyFav; document.getElementById('fav-filter').classList.toggle('active', showOnlyFav); renderFeed(); }
    function filterByTag(tag) {
      activeTag = tag;
      document.querySelectorAll('#tag-bar .tag-btn').forEach(btn => btn.classList.toggle('active', btn.innerText === (tag === 'all' ? 'Всі' : '#' + tag)));
      renderFeed();
    }
    function handleSearch() { searchQuery = document.getElementById('search-input').value.toLowerCase().trim(); renderFeed(); }
    function toggleFullText(id) {
      const el = document.getElementById('full-' + id); const btn = document.getElementById('btn-' + id);
      const isShow = el.style.display === 'block'; el.style.display = isShow ? 'none' : 'block'; btn.innerText = isShow ? 'Читати повністю ▾' : 'Згорнути ▴';
    }
    function openLightbox(u) { document.getElementById('lightbox-img').src = u; document.getElementById('lightbox-modal').style.display = 'flex'; }
    function closeLightbox() { document.getElementById('lightbox-modal').style.display = 'none'; document.getElementById('lightbox-img').src = ''; }
    function renderFeed() {
      const favs = getBookmarks(); const container = document.getElementById('feed-container'); container.innerHTML = '';
      const now = new Date(); const yesterday = new Date(); yesterday.setDate(now.getDate() - 1);
      const sorted = (rawData.articles || []).slice().sort((a, b) => parseItemDate(b.published_at) - parseItemDate(a.published_at));
      const filtered = sorted.filter(a => {
        if (showOnlyFav && !favs.includes(a.id)) return false;
        if (activeTag !== 'all' && !(a.tags || []).includes(activeTag)) return false;
        const pub = parseItemDate(a.published_at);
        if (dateFilter === 'today' && !isSameDay(pub, now)) return false;
        if (dateFilter === 'yesterday' && !isSameDay(pub, yesterday)) return false;
        if (quickFilter === 'alert' && (a.importance || 1) < 4) return false;
        if (quickFilter === 'power' && !isEnergyArticle(a)) return false;
        if (quickFilter === 'world' && !isWorldArticle(a)) return false;
        if (quickFilter === 'ua' && !isUaArticle(a)) return false;
        if (quickFilter === 'kremen' && !isKremenArticle(a)) return false;
        if (searchQuery) {
          const match = ((a.title||'') + ' ' + (a.summary||'') + ' ' + (a.raw_text||'')).toLowerCase();
          if (!match.includes(searchQuery)) return false;
        }
        return true;
      });
      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center;color:gray;padding:20px 0;">Новин за вибраними фільтрами немає</p>'; return;
      }
      filtered.forEach(a => {
        const isFav = favs.includes(a.id); const isUrgent = (a.importance || 1) >= 4;
        let theme = '';
        if (quickFilter === 'power' || isEnergyArticle(a)) theme = 'theme-energy';
        else if (quickFilter === 'world' || isWorldArticle(a)) theme = 'theme-world';
        else if (quickFilter === 'ua' || isUaArticle(a)) theme = 'theme-ua';
        else if (quickFilter === 'kremen' || isKremenArticle(a)) theme = 'theme-kremen';
        else if (isUrgent) theme = 'urgent';

        let rawMedia = a.media_list || []; if (!rawMedia.length && a.media) rawMedia = [a.media];
        let mediaItems = [];
        let seenUrls = new Set();
        rawMedia.forEach(m => {
          if (m && m.url && !seenUrls.has(m.url)) {
            seenUrls.add(m.url);
            mediaItems.push(m);
          }
        });
        let mediaHtml = '';
        if (mediaItems.length > 0) {
          const count = Math.min(mediaItems.length, 4);
          let items = '';
          mediaItems.forEach(m => {
            if (m.type === 'image') items += '<img src="' + m.url + '" loading="lazy" onclick="openLightbox(\'' + m.url + '\')">';
            else if (m.type === 'video') items += '<video src="' + m.url + '" controls></video>';
          });
          mediaHtml = '<div class="media-gallery gallery-' + count + '">' + items + '</div>';
        }
        let relHtml = '';
        if (a.related_sources && a.related_sources.length > 0) {
          relHtml = '<div class="related-box">Про це також повідомили: ' + a.related_sources.map(s => '<a href="' + s.source_url + '" target="_blank">' + s.source_name + '</a>').join(', ') + '</div>';
        }
        const tagsHtml = (a.tags || []).map(t => '<span class="badge">#' + t + '</span>').join('');
        const card = document.createElement('div');
        card.className = 'card ' + theme;
        card.innerHTML = mediaHtml +
          '<div class="card-body">' +
            '<div class="card-meta"><span>' + a.source_name + ' • ' + (a.category||'Новина') + '</span><button class="bookmark-btn" onclick="toggleBookmark(\'' + a.id + '\')">' + (isFav ? '⭐' : '☆') + '</button></div>' +
            '<div class="card-time-row">' + (isUrgent ? '<span class="urgent-badge">🚨 ТЕРМІНОВО</span>' : '') + (a.published_at ? '<span>🕒 ' + formatDateTime(a.published_at) + '</span>' : '') + '<span class="reading-time">' + calcReadingTime(a.raw_text||a.summary) + '</span></div>' +
            '<div class="card-title">' + a.title + '</div><div class="card-summary">' + a.summary + '</div>' + relHtml +
            '<div class="full-text" id="full-' + a.id + '">' + (a.raw_text||a.summary) + '</div>' +
            '<div class="card-actions"><button class="toggle-full-btn" id="btn-' + a.id + '" onclick="toggleFullText(\'' + a.id + '\')">Читати повністю ▾</button><a href="' + a.source_url + '" target="_blank" class="source-link">Джерело ↗</a></div>' +
            '<div class="card-tags">' + tagsHtml + '</div>' +
          '</div>';
        container.appendChild(card);
      });
    }
    function startPolling() {
      const sb = document.getElementById('status-bar'); sb.style.display = 'block'; sb.innerText = '⏳ Збираємо та сортуємо новини...';
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch('/api/status'); const d = await res.json();
          if (!d.updating) { clearInterval(pollInterval); sb.innerText = '✅ Оновлено!'; await init(); setTimeout(() => sb.style.display = 'none', 2000); }
        } catch (e) { clearInterval(pollInterval); }
      }, 3000);
    }
    async function triggerRefresh() { await fetch('/api/refresh', { method: 'POST' }); startPolling(); }
    async function openSourcesModal() { document.getElementById('sources-modal').style.display = 'flex'; await loadSourcesList(); }
    function closeSourcesModal() { document.getElementById('sources-modal').style.display = 'none'; }
    async function loadSourcesList() {
      const el = document.getElementById('modal-sources-list');
      try {
        const res = await fetch('sources.json?t=' + Date.now()); const d = await res.json();
        currentSources = d.map(i => typeof i === 'string' ? { url: i } : i);
        el.innerHTML = currentSources.map((s, idx) => '<div class="source-item"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px;">' + s.url + '</span><button class="del-btn" onclick="deleteSource(' + idx + ')">✕</button></div>').join('');
      } catch (e) { el.innerHTML = '<p style="color:gray;">Помилка sources.json</p>'; }
    }
    async function saveSources(s) {
      try {
        const res = await fetch('/api/sources', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(s) });
        if (res.ok) { await loadSourcesList(); startPolling(); }
      } catch (e) { alert('Помилка збереження'); }
    }
    async function addNewSource() {
      const input = document.getElementById('new-channel-input'); let val = input.value.trim(); if (!val) return;
      if (val.includes('t.me/')) {
        const parts = val.split('t.me/'); let tail = parts[1].replace('s/', '').split('/')[0]; val = 'https://t.me/s/' + tail;
      } else if (!val.startsWith('http://') && !val.startsWith('https://')) { val = 'https://t.me/s/' + val.replace('@', ''); }
      if (currentSources.some(s => s.url.toLowerCase() === val.toLowerCase())) { alert('Вже є у списку'); return; }
      currentSources.push({ url: val, limit: 6 }); await saveSources(currentSources); input.value = '';
    }
    async function deleteSource(idx) { currentSources.splice(idx, 1); await saveSources(currentSources); }
    init();
  </script>
</body>
</html>
